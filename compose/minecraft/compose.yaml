services:
  minecraft:
    image: itzg/minecraft-server:${MC_IMAGE_TAG:-java21}
    restart: unless-stopped
    stop_grace_period: 2m
    stdin_open: true
    tty: true
    environment:
      EULA: ${MC_EULA:-FALSE}
      VERSION: ${MC_VERSION:-1.21.11}
      TYPE: ${MC_TYPE:-VANILLA}
      CUSTOM_SERVER: ${MC_CUSTOM_SERVER:-}
      MEMORY: ${MC_MEMORY:-12G}
      ONLINE_MODE: ${MC_ONLINE_MODE:-FALSE}
      LEVEL: ${MC_LEVEL:-world}
      MAX_PLAYERS: ${MC_MAX_PLAYERS:-10}
      SERVER_PORT: "25565"
      VIEW_DISTANCE: ${MC_VIEW_DISTANCE:-10}
      SIMULATION_DISTANCE: ${MC_SIMULATION_DISTANCE:-10}
      ENABLE_RCON: "false"
      TZ: ${TZ:-Europe/Paris}
    ports:
      - "${BIND_IP:-127.0.0.1}:${MC_PORT:-25565}:25565"
    volumes:
      - ${MC_DATA_PATH:-world}:/data
    healthcheck:
      test: [CMD, mc-health]
      interval: 30s
      timeout: 10s
      start_period: 3m
      retries: 5
volumes:
  world:
