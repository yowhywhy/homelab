services:
  web:
    image: ${WEB_IMAGE:-homelab-next:local}
    build:
      context: ${WEB_CONTEXT:-../../templates/nextjs}
      target: runner
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      APP_MESSAGE: ${APP_MESSAGE:-Homelab operationnel}
      DATABASE_URL: ${DATABASE_URL:-}
    ports:
      - "${BIND_IP:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
