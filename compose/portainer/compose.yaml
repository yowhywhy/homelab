services:
  portainer:
    image: portainer/portainer-ce:${PORTAINER_TAG:-lts}
    restart: unless-stopped
    environment:
      AGENT_SECRET: ${AGENT_SECRET:?Configurer le secret commun serveur et agents}
    ports:
      - "${BIND_IP:-127.0.0.1}:${PORTAINER_PORT:-9443}:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
volumes:
  portainer_data:
